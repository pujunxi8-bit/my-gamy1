/* Layout: one centered column. HUD strip on top, the battlefield canvas as a taped-on notebook page, weapon rack below. Menus are full-screen sheets so they stay usable on a phone. Single look: blue graph paper with heavy ink outlines. */
:root{
  --paper:#e8eef3;

  --cool:#2a6f97;
  --hot:#e4572e;
  --gold:#f2b134;

  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{

  background-size:24px 24px;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:880px;margin-inline:auto;display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,7vw,44px);line-height:1;margin:0;letter-spacing:.03em;text-wrap:balance}
.lv{font-family:var(--f-mono);font-size:13px;color:var(--ink-soft);margin-top:6px;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:13px;border:2px solid var(--ink);background:var(--white);color:var(--ink);padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums;line-height:1.2}
.chip.coin{background:var(--gold);font-weight:500}
button.chip{cursor:pointer;font-family:var(--f-mono)}
button.chip:hover{background:var(--paper-2)}
.stage{position:relative;border:3px solid var(--ink);border-radius:8px;background:var(--white);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.hint{margin:0;min-height:1.5em;font-size:13px;color:var(--ink-soft)}
.rack{display:flex;flex-wrap:wrap;gap:8px}
.wpn{display:grid;justify-items:center;gap:2px;width:80px;padding:6px 4px 5px;border:2px solid var(--ink);border-radius:8px;background:var(--white);color:var(--ink);font:inherit;cursor:pointer}
.wpn canvas{width:44px;height:44px;aspect-ratio:auto;cursor:pointer}
.wpn b{font-size:12px;font-weight:900}
.wpn i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--ink-soft)}
.wpn.on{background:var(--gold);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.wpn.on i{color:var(--ink)}
button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(232,238,243,.95);padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:640px;margin-block:auto;display:grid;gap:14px;border:3px solid var(--ink);border-radius:8px;background:var(--white);box-shadow:6px 6px 0 var(--ink);padding:20px}
.panel h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1.1;text-wrap:balance}
.panel p{margin:0;line-height:1.6}
.panel{position:relative}
.panel.start{padding:44px 30px 60px}.panel.start h2{padding-left:clamp(40px,9vw,64px)}
.deco{position:absolute;pointer-events:none;height:auto;filter:drop-shadow(2px 2px 0 rgba(27,42,65,.25))}

.deco.bl{bottom:-16px;left:-12px;width:clamp(96px,20vw,150px);transform:rotate(-3deg)}

.rules{margin:0;padding-left:1.2em;display:grid;gap:6px;line-height:1.5}
.btn{justify-self:start;font:inherit;font-weight:900;font-size:16px;padding:10px 22px;border:2px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--white);cursor:pointer;box-shadow:3px 3px 0 var(--gold)}

.btn.alt{background:var(--white);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}

.card{display:grid;gap:6px;align-content:start;border:2px solid var(--ink);border-radius:8px;padding:10px;background:var(--paper)}

.badge{display:inline-block;color:#fff;border-radius:4px;padding:0 5px;font-size:10.5px;font-weight:700}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.shop-bar{position:sticky;top:-20px;z-index:3;margin:-20px -20px 0;padding:12px 20px;background:var(--white);border-bottom:3px solid var(--ink);border-radius:5px 5px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shop-bar h2{font-size:clamp(20px,5vw,26px);margin-bottom:4px}
.bar-btns{display:flex;gap:10px}
.btn.small2{font-size:14px;padding:8px 14px}
.shop-info{font-size:13px;color:var(--ink-soft)}
.sec{margin:6px 0 -4px;font-size:13px;font-family:var(--f-mono);letter-spacing:.08em;color:var(--ink-soft)}
.wlist{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:44px 1fr minmax(92px,auto);gap:12px;align-items:center;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;background:var(--paper)}
.wrow.can{background:#e8f6ec;border-color:#2f8f5b;box-shadow:3px 3px 0 #2f8f5b}
.wrow.cant{opacity:.6}
.wrow.own{background:var(--white)}
.wrow.on{outline:3px solid var(--ink);outline-offset:2px}
.wrow .ic{width:44px;height:44px;display:grid;place-items:center;font-size:26px;color:#c3141f}
.wrow h3{margin:0;font-size:15px;font-weight:900}
.wrow .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)}
.wrow .desc{font-size:12px;line-height:1.4;color:var(--ink-soft);margin-top:2px}
.wrow canvas{width:44px;height:44px;aspect-ratio:auto;cursor:default}
.badge.op{background:#c3141f;font-size:10px;vertical-align:middle}
@media (max-width:420px){.wrow{grid-template-columns:40px 1fr;}.wrow>.btn{grid-column:1/-1}}
.card h3{margin:0;font-size:15px;font-weight:900}
.card .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)}
.card .desc{font-size:12.5px;line-height:1.45;min-width:0}
.card canvas{width:44px;height:44px;aspect-ratio:auto;cursor:default}
.card .row{display:flex;align-items:center;gap:10px}
.big-num{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}

function circleRect(cx,cy,r,o){
  var qx=clamp(cx,o.x,o.x+o.w),qy=clamp(cy,o.y,o.y+o.h),dx=cx-qx,dy=cy-qy,d2=dx*dx+dy*dy;

/* ---------- obstacles ---------- */
function breakCrate(o){
  var i=obstacles.indexOf(o);if(i>=0)obstacles.splice(i,1);
  burst(o.x+o.w/2,o.y+o.h/2,12,WOOD,220,.7);
}
function shatter(o,vx,vy){
  var i=obstacles.indexOf(o);if(i<0)return;
  obstacles.splice(i,1);
  sfx('glass');shake(3);
  for(var n=0;n<30;n++){
    parts.push({x:o.x+rnd(0,o.w),y:o.y+rnd(0,o.h),vx:vx*.25+rnd(-160,160),vy:vy*.15+rnd(-260,40),t:0,life:rnd(.6,1.2),c:Math.random()<.5?'#bfe6f5':'#ffffff',r:rnd(2,5)});
  }
}
function supportY(o){
  var s=Math.min(groundY(o.x),groundY(o.x+o.w/2),groundY(o.x+o.w));
  for(var i=0;i<obstacles.length;i++){
    var q=obstacles[i];
    if(q===o||q.type==='mirror')continue;
    if(q.x<o.x+o.w-2&&q.x+q.w>o.x+2&&q.y>=o.y+o.h-3&&q.y<s)s=q.y;
  }
  return s;
}
/* crates fall when what they stand on is gone */
function stepCrates(dt){
  obstacles.forEach(function(o){
    if(o.type!=='crate')return;
    var sup=supportY(o);
    if(o.y+o.h<sup-.5){
      o.vy=(o.vy||0)+G0*dt;o.y+=o.vy*dt;
      if(o.y+o.h>=sup){
        o.y=sup-o.h;
        if(o.vy>180){sfx('thud');burst(o.x+o.w/2,o.y+o.h,5,WOOD,120,.4);o.sh=.15;}
        o.vy=0;
      }
    }else o.vy=0;
  });
}

  if(f.dead)return;

  var hp0=f.hp;

  var P=pose(f);
  pop(P.head.x,P.head.y-28,'-'+dmg+(head?'!':''),head?HOT:INK,head);
  burst(P.neck.x,P.neck.y,head?10:6,head?HOT:INK2,200,.45);
  var bx=imp&&imp.x?imp.x:rnd(-1,1),by=imp&&imp.y?imp.y:-100;

  blood(bp.x,bp.y,Math.min(110,18+Math.round(dmg*2)+(head?22:0)),bx,by*.5-60,280+Math.min(340,dmg*7));
  if(head||dmg>=22)lensSplat(head?3:2);
  if(!f.wounds)f.wounds=[];
  if(f.wounds.length<16)f.wounds.push({t:rnd(.05,.95),o:rnd(-3,3),r:rnd(2.5,6)});
  gore(f,P,dmg,head,hpt,bx,by);

  sfx(head?'head':'hit');
  shake(head?5:3);
  if(f.hp<=0){
    f.dead=true;
    if(f.side==='e'){
      if(owner&&owner.side==='p'){earn(20);pop(P.hip.x,P.head.y-60,'K.O. +20',GOOD,true);}

      blood(P.hip.x,P.hip.y,120,0,-1,700);
      pop(P.hip.x,P.head.y-84,tr('t_gib'),HOT,true);
    }else if((head&&Math.random()<.65)||(imp&&imp.m>=2.5&&Math.random()<.5)){
      f.headless=true;f.fountain=3.2;
      parts.push({x:P.head.x,y:P.head.y,vx:(bx>0?1:-1)*rnd(120,330),vy:-rnd(300,520),t:0,life:14,headp:1,rot:0,vr:rnd(-12,12),r:12,c:PAPER});

function hitTest(f,p){

  if(!f.legless&&(distSeg(p.x,p.y,P.hip,P.ftL)<6+r||distSeg(p.x,p.y,P.hip,P.ftR)<6+r))return'leg';

}
function impact(p,f,part){
  var wp=WP[p.w];
  if(wp.strike){callStrike(p);p.state='gone';return;}
  if(wp.timed){p.vx*=-.35;p.vy=-80;return;}
  if(wp.boom){explode(p.x,p.y,p);p.state='gone';return;}
  var sp=Math.hypot(p.vx,p.vy),k=clamp(sp/(VMAX*wp.spd),.6,1);
  var mult=part==='head'?wp.head:(part==='leg'?.7:1);
  var dmg=Math.max(1,Math.round(wp.dmg*mult*(.8+.2*k)*p.dm));
  var hpt={x:p.x,y:p.y};
  if(wp.stick)attachStuck(f,p);
  hurt(f,dmg,part==='head',{x:p.vx,y:p.vy,m:wp.m||1},p.owner,hpt);
  if(wp.psn)poison(f,6,3,p.owner);
  if(wp.igniteHit)ignite(f,4,4,p.owner);
  if(wp.freezeHit)freeze(f);
  if(wp.steal&&p.owner&&!p.owner.dead)p.owner.hp=Math.min(p.owner.maxHp,p.owner.hp+Math.round(dmg*wp.steal));
  if(wp.stick){p.state='gone';return;}
  if(wp.pierce){p.vx*=.92;return;}
  if(wp.roll){p.vx*=-.25;p.vy=-120;}
  else{p.state='drop';p.fade=0;p.vx*=-.2;p.vy=-100;}
}
function hitObstacle(p,o,c){
  var wp=WP[p.w];
  if(o.type==='mirror'){shatter(o,p.vx,p.vy);p.vx*=.8;p.vy*=.8;return;}
  if(wp.strike){callStrike(p);p.state='gone';return;}
  if(wp.boom&&!wp.timed){explode(p.x,p.y,p);p.state='gone';return;}
  var broke=false;
  if(o.type==='crate'){
    o.hp-=wp.dmg*(wp.crate||1);o.sh=.2;sfx('thud');burst(p.x,p.y,6,WOOD,160,.5);
    if(o.hp<=0){broke=true;breakCrate(o);}
  }else{burst(p.x,p.y,6,GOLD,200,.35);sfx('clink');}
  p.x+=c.nx*(wp.r-c.d+.5);p.y+=c.ny*(wp.r-c.d+.5);
  if(wp.roll){
    if(broke){p.vx*=.75;return;}
    var vn=p.vx*c.nx+p.vy*c.ny;
    if(vn<0){p.vx-=1.5*vn*c.nx;p.vy-=1.5*vn*c.ny;}

function groundHit(p,gy){

    var n=groundN(p.x),vn=p.vx*n.nx+p.vy*n.ny;

function stepProj(p,dt){
  var wp=WP[p.w];

    p.fade+=dt;if(p.fade>1.2)p.state='gone';return;
  }
  var k=1-(wp.drag==null?.06:wp.drag)*dt;
  p.vy+=G0*wp.g*dt;p.vx*=k;p.vy*=k;
  if(wp.homing)steer(p,dt);
  if(wp.ret&&boomSteer(p,dt)){p.state='gone';return;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life+=dt;
  if(wp.aim)p.rot=Math.atan2(p.vy,p.vx);
  if(wp.homing&&p.life>5){explode(p.x,p.y,p);p.state='gone';return;}
  if(wp.timed&&p.life>wp.timed){explode(p.x,p.y,p);p.state='gone';return;}
  if(p.state==='drop'){
    p.fade+=dt;
    var g1=groundY(p.x);
    if(p.y+wp.r>=g1){p.y=g1-wp.r*.5;p.vx=p.vy=0;p.state='stuck';}
    if(p.fade>1.4)p.state='gone';
    return;
  }
  p.tc=(p.tc||0)+1;if(p.tc%3===0){p.trail.push({x:p.x,y:p.y});if(p.trail.length>14)p.trail.shift();}
  if(p.x<-80||p.x>W+80||p.y>H+120||p.life>9){p.state='gone';return;}
  for(var i=0;i<fighters.length;i++){
    var f=fighters[i];
    if(f.dead||p.hit[i]||(f===p.owner&&(p.life<.3||wp.ret)))continue;
    var part=hitTest(f,p);
    if(part){p.hit[i]=1;impact(p,f,part);if(p.state!=='fly')return;}
  }
  for(var j=0;j<obstacles.length;j++){
    var o=obstacles[j],c=circleRect(p.x,p.y,wp.r,o);
    if(c){hitObstacle(p,o,c);if(p.state!=='fly')return;break;}
  }
  var gy=groundY(p.x);
  if(p.y+wp.r>=gy)groundHit(p,gy);

function steer(p,dt){
  var tg=null,bd=1e9;
  fighters.forEach(function(f){
    if(f.dead||f.side===p.owner.side)return;
    var P=pose(f),d=Math.hypot(P.hip.x-p.x,P.hip.y-p.y);
    if(d<bd){bd=d;tg={x:P.hip.x,y:(P.hip.y+P.neck.y)/2};}
  });
  var sp=Math.hypot(p.vx,p.vy),a=Math.atan2(p.vy,p.vx);
  if(tg&&p.life>.2){
    var diff=Math.atan2(tg.y-p.y,tg.x-p.x)-a;
    while(diff>Math.PI)diff-=2*Math.PI;
    while(diff<-Math.PI)diff+=2*Math.PI;
    a+=clamp(diff,-4.5*dt,4.5*dt);
  }
  sp+=(620-sp)*Math.min(1,2.5*dt);
  p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;
  if(p.life>.1&&Math.random()<.7)parts.push({x:p.x,y:p.y,vx:rnd(-30,30),vy:rnd(-30,30),t:0,life:.35,c:Math.random()<.5?GOLD:INK2,r:rnd(2,4)});
}

/* boomerang: after half a second it flies back to its thrower and is caught */
function boomSteer(p,dt){

/* lightning: a bolt on every living opponent */
function strikeLightning(f){

    if(t.dead||t.side===f.side)return;

/* black hole: pulls every body toward its centre for about two seconds, then collapses in a blast */
var wells=[];
function openWell(p){
  wells.push({x:p.x,y:Math.min(p.y,groundY(p.x)-26),t:0,life:1.6,owner:p.owner,dm:p.dm});
  sfx('boom');shake(4);

function stepWells(dt){
  wells.forEach(function(w){
    w.t+=dt;
    var R=200;
    fighters.forEach(function(f){
      var P=pose(f),d=Math.hypot(P.hip.x-w.x,P.hip.y-w.y);
      if(d>R)return;
      var k=1-d/R;
      if(!f.rag&&!f.dead)startRag(f,{x:0,y:-150,m:1},{x:P.hip.x,y:P.hip.y});
      if(!f.rag)return;
      if(!f.dead)f.rag.t=0;
      RAGN.forEach(function(n){
        var p=f.rag.pts[n],dx=w.x-p.x,dy=w.y-p.y,dd=Math.hypot(dx,dy)||1,sp=(45+210*k)*dt;
        p.x+=dx/dd*sp;p.y+=dy/dd*sp;
      });
    });
    var a=rnd(0,6.28),r=rnd(60,R);
    parts.push({x:w.x+Math.cos(a)*r,y:w.y+Math.sin(a)*r,vx:-Math.cos(a)*240,vy:-Math.sin(a)*240-200,t:0,life:.4,c:'#7b5ea7',r:rnd(2,4)});
    if(w.t>=w.life){

/* laser: instant ray, passes through bodies, burns crates, bounces once off each mirror */
function fireLaser(f,dx,dy){
  var P=pose(f),x=P.sh.x+dx*20,y=P.sh.y+dy*20,vx=dx,vy=dy,pts=[{x:x,y:y}],got={},wp=WP.laser;
  for(var i=0;i<460;i++){
    x+=vx*4;y+=vy*4;
    if(x<-30||x>W+30||y<-250)break;
    if(y>=groundY(x)){burst(x,y,10,GOLD,220,.5);break;}
    var stop=false,q;
    for(q=0;q<fighters.length;q++){
      var ff=fighters[q];
      if(ff.dead||got[q]||(ff===f&&i<10))continue;
      var part=hitTest(ff,{x:x,y:y,w:'laser'});
      if(part){
        got[q]=1;
        hurt(ff,Math.round(wp.dmg*(part==='head'?wp.head:1)*(f.side==='e'?em:1)),part==='head',{x:vx*600,y:vy*600,m:1.6},f,{x:x,y:y});
      }
    }
    for(var j=0;j<obstacles.length&&!stop;j++){
      var o=obstacles[j];
      if(x<o.x||x>o.x+o.w||y<o.y||y>o.y+o.h)continue;
      if(o.type==='mirror'){pts.push({x:x,y:y});vx=-vx;shatter(o,vx*200,vy*40);}
      else if(o.type==='crate'){breakCrate(o);}
      else{burst(x,y,8,GOLD,240,.4);stop=true;}
    }
    if(stop)break;
  }
  pts.push({x:x,y:y});
  lasers.push({pts:pts,t:0});
  sfx('laser');shake(4);
}

/* ---------- enemy AI ---------- */
function simMiss(s,wp,pt){
  var x=s.x,y=s.y,vx=s.vx,vy=s.vy,dt=HS,best2=1e9,k=1-(wp.drag==null?.06:wp.drag)*dt;
  for(var i=0;i<(wp.ret?60:720);i++){
    vy+=G0*wp.g*dt;vx*=k;vy*=k;x+=vx*dt;y+=vy*dt;
    var d=Math.hypot(x-pt.x,y-pt.y);if(d<best2)best2=d;
    if(y+wp.r>=groundY(x)||x<-20||x>W+20)break;
    var hit=false;
    for(var j=0;j<obstacles.length;j++){if(obstacles[j].type!=='mirror'&&circleRect(x,y,wp.r,obstacles[j])){hit=true;break;}}
    if(hit)break;
  }
  return best2;
}
function planShot(f,wid){
  var wp=WP[wid],P=pose(player),aimPt={x:(P.hip.x+P.neck.x)/2,y:(P.hip.y+P.neck.y)/2};
  var sh=pose(f).sh,bestPlan=null;
  for(var ang=12;ang<=82;ang+=2){
    for(var pw=.4;pw<=1.001;pw+=.04){
      var a=ang*Math.PI/180,sp=VMAX*wp.spd*pw;
      var d=simMiss({x:sh.x-Math.cos(a)*20,y:sh.y-Math.sin(a)*20,vx:-Math.cos(a)*sp,vy:-Math.sin(a)*sp},wp,aimPt);
      if(!bestPlan||d<bestPlan.d)bestPlan={d:d,ang:ang,pw:pw};
    }
  }
  var sig=Math.max(1.2,11-st.level*.9);
  var ang2=(bestPlan.ang+gauss()*sig)*Math.PI/180,pw2=clamp(bestPlan.pw*(1+gauss()*sig*.006),.3,1);
  var sp2=VMAX*wp.spd*pw2;
  return{dx:-Math.cos(ang2),dy:-Math.sin(ang2),vx:-Math.cos(ang2)*sp2,vy:-Math.sin(ang2)*sp2};
}

/* ---------- turn flow ---------- */
function setHint(t){st.hint=null;el('hint').textContent=t;}

function startPlayerTurn(){
  if(player.frost||player.stun){
    var fzp=player.frost;player.frost=false;player.stun=false;st.phase='busy';
    banner(tr(fzp?'t_frozen':'t_stunned'),COOL,1.3);
    later(1.4,afterPlayer);return;
  }
  st.phase='aim';banner(tr('yourTurn'),COOL,.9);
  hintK('aimHint');
}
function afterPlayer(){
  if(player.dead)return lose();
  if(enemies.every(function(e){return e.dead;}))return win();
  var list=enemies.filter(function(e){return!e.dead;});
  st.phase='enemy';banner(tr('enemyTurn'),HOT,.9);hintK('enemyHint');
  later(.8,function(){runEnemy(list,0);});
}
function runEnemy(list,i){
  if(player.dead)return lose();
  if(enemies.every(function(e){return e.dead;}))return win();
  if(i>=list.length)return startPlayerTurn();
  var e=list[i];
  if(e.dead)return runEnemy(list,i+1);
  if(e.frost||e.stun){
    var fze=e.frost;e.frost=false;e.stun=false;var Pf=pose(e);pop(Pf.head.x,Pf.head.y-52,tr(fze?'t_frozen':'t_stunned'),COOL,true);
    later(.9,function(){runEnemy(list,i+1);});return;
  }
  var pool=NONOP.slice(0,Math.min(NONOP.length,2+Math.floor(st.level/2)));
  var wid=pool[Math.floor(Math.random()*pool.length)];
  var plan=planShot(e,wid);
  e.aim={dx:plan.dx,dy:plan.dy,w:wid};e.leanT=.12;
  st.pending=true;st.waiter=function(){runEnemy(list,i+1);};

  });
}
function playerThrow(pv){

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  for(var i=timers.length-1;i>=0;i--){var tm=timers[i];tm.t-=dt;if(tm.t<=0){timers.splice(i,1);tm.fn();}}
  fighters.forEach(function(f){
    f.flash=Math.max(0,f.flash-dt);
    if(f.rag){
      if(!f.dead){
        f.rag.t+=dt;
        if(f.rag.t>=1&&(ragSettled(f)||f.rag.t>=1.7))getUp(f);
      }
      return;
    }
    if(f.up){f.up.t+=dt;if(f.up.t>=f.up.dur)f.up=null;}
    f.leanV+=((f.leanT-f.lean)*80-f.leanV*8)*dt;
    f.lean=clamp(f.lean+f.leanV*dt,-.7,.9);
    if(f.anim){f.anim.t+=dt;if(f.anim.t>.4)f.anim=null;}
  });
  if(drag&&st.phase==='aim'){
    var pv=pull();
    player.aim={dx:pv.dx,dy:pv.dy,w:st.sel};
    player.leanT=pv.len>22?.22*pv.frac:0;
  }
  st.acc=(st.acc||0)+dt;
  for(var cnt=0;st.acc>=HS&&cnt<10;cnt++){
    st.acc-=HS;
    for(var k=0;k<proj.length;k++)if(proj[k].state!=='gone')stepProj(proj[k],HS);
    fighters.forEach(function(f){if(f.rag)stepRag(f);});
  }
  if(st.acc>HS*10)st.acc=0;
  stepCrates(dt);
  stepWells(dt);
  stepFx(dt);
  if(st.phase==='aim'){if(player.dead)lose();else if(enemies.every(function(e){return e.dead;}))win();}
  proj=proj.filter(function(p){return p.state!=='gone';});
  parts.forEach(function(p){
    p.t+=dt;p.vy+=(p.g===undefined?900:p.g)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.limb||p.headp)p.rot+=p.vr*dt;if(p.headp&&Math.random()<dt*34)blood(p.x,p.y,1,rnd(-1,1),1,90);
    var g=groundY(p.x);
    if(p.eye){if(p.y>g){p.y=g;p.vy*=-.45;p.vx*=.7;if(Math.abs(p.vy)>60&&Math.random()<.7)stain(p.x,4);}p.vx*=1-1.5*dt;if(Math.random()<dt*20)blood(p.x,p.y,1,0,1,30);}
    else if(p.b){
      if(p.y>g){stain(p.x,p.b===2?7:p.r*1.6,p.acid?'rgba(120,190,25,.75)':undefined);p.t=p.life;}
    }else if(p.y>g){p.y=g;p.vy*=-.35;p.vx*=.6;if(p.limb||p.headp)p.vr*=.7;}
  });
  parts=parts.filter(function(p){return p.t<p.life;});
  fighters.forEach(function(f){
    var P=pose(f);
    if(f.pool>0&&f.dead){f.pool-=dt;if(Math.random()<dt*14)stain(P.hip.x+rnd(-26,26),rnd(7,13));}
    if(!f.headless&&(f.eyeOut||f.hw>1)&&!(f.dead&&f.pool<=0)&&Math.random()<dt*(f.dead?4:7))blood(P.head.x+f.dir*4,P.head.y+2,1,rnd(-.3,.3),1,50);
    if(f.guts&&Math.random()<dt*(f.dead?3:5))blood(P.neck.x+(P.hip.x-P.neck.x)*.78,P.neck.y+(P.hip.y-P.neck.y)*.78,1,f.gutSd*.3,1,40);
    if(f.wounds&&f.wounds.length&&!(f.dead&&f.pool<=0)&&Math.random()<dt*(f.dead?3:1.6*Math.min(1,f.wounds.length/4))){
      blood(P.neck.x+(P.hip.x-P.neck.x)*rnd(.1,.9),P.neck.y+(P.hip.y-P.neck.y)*rnd(.1,.9),1,rnd(-1,1),1,40);
    }
  });
  pops.forEach(function(p){p.t+=dt;p.y-=40*dt;});pops=pops.filter(function(p){return p.t<1.1;});
  rings.forEach(function(r){r.t+=dt;});rings=rings.filter(function(r){return r.t<.4;});
  lasers.forEach(function(l){l.t+=dt;});lasers=lasers.filter(function(l){return l.t<.35;});
  obstacles.forEach(function(o){o.sh=Math.max(0,(o.sh||0)-dt);});
  if(st.banner){st.banner.t+=dt;if(st.banner.t>=st.banner.dur)st.banner=null;}

  var calm=fighters.every(function(f){return f.dead||(!f.rag&&!f.up);});
  var still=!proj.some(function(p){return p.state==='fly';})&&!st.volley&&!wells.length&&!fighters.some(function(f){return!f.dead&&(f.burn>0||f.acid>0);});

    st.settleT+=dt;
    if(st.settleT>.6||st.waitT>10){var w=st.waiter;st.waiter=null;st.settleT=0;st.waitT=0;w();}
  }else st.settleT=0;
  updateHud();
}

function aura(f,P){

function drawBanner(){
  var b=st.banner;if(!b)return;
  var k=b.t/b.dur,a=k<.15?k/.15:(k>.8?(1-k)/.2:1),sc=.85+.15*Math.min(1,k/.15);
  ctx.save();ctx.translate(W/2,150);ctx.scale(sc,sc);ctx.globalAlpha=clamp(a,0,1);
  ctx.font='900 54px '+FD;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=11;ctx.strokeStyle=INK;
  ctx.strokeText(b.txt,0,0);ctx.fillStyle=b.c;ctx.fillText(b.txt,0,0);
  ctx.restore();
}
function draw(){
  var s=cv.width/W;
  ctx.setTransform(s,0,0,s,0,0);
  ctx.save();
  if(st.shake>0)ctx.translate(rnd(-1,1)*st.shake,rnd(-1,1)*st.shake);
  var cm=st.cam,cz=1;
  if(cm){
    var u=cm.t<.35?cm.t/.35:(cm.t>cm.dur-.45?(cm.dur-cm.t)/.45:1);u=u*u*(3-2*u);
    cz=1+1.9*u;
    var Pc=pose(cm.f),fx=clamp(Pc.hip.x,W/2/cz,W-W/2/cz),fy=clamp(Pc.hip.y-8,H/2/cz,H-H/2/cz);
    fx=W/2+(fx-W/2)*u;fy=H/2+(fy-H/2)*u;
    ctx.translate(W/2,H/2);ctx.scale(cz,cz);ctx.translate(-fx,-fy);
  }
  drawBG();
  stains.forEach(function(b){ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(b.x,b.y,b.w,b.h,0,0,Math.PI*2);ctx.fill();});
  drawZones();
  obstacles.forEach(drawObstacle);
  fighters.filter(function(f){return f.dead;}).forEach(drawFighter);
  fighters.filter(function(f){return!f.dead;}).forEach(drawFighter);
  proj.forEach(drawProj);
  drawPreview();
  drawFX();
  ctx.restore();
  if(cm&&cz>1.02){
    var bar=(cz-1)/1.9*34,vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.85);
    vg.addColorStop(0,'rgba(60,0,8,0)');vg.addColorStop(1,'rgba(60,0,8,'+(.45*(cz-1)/1.9).toFixed(2)+')');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#10131a';ctx.fillRect(0,0,W,bar);ctx.fillRect(0,H-bar,W,bar);
  }
  lens.forEach(function(b){
    var a=clamp(1-b.t/b.life,0,1)*b.a,yy=b.y+b.t*b.v*(1+b.t*.4);
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle='rgba(140,8,18,.9)';ctx.lineWidth=b.r*.55;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,yy);ctx.stroke();
    ctx.fillStyle='rgba(160,12,24,.92)';ctx.beginPath();ctx.arc(b.x,yy,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,170,170,.35)';ctx.beginPath();ctx.arc(b.x-b.r*.3,yy-b.r*.3,b.r*.28,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  drawBanner();
  if(st.flash>0){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(255,255,255,'+Math.min(1,st.flash).toFixed(2)+')';ctx.fillRect(0,0,cv.width,cv.height);}
}

  if(w&&cv.width!==w){cv.width=w;cv.height=Math.round(w*H/W);}

var last=0;
function frame(ts){
  var dt=last?Math.min(.033,(ts-last)/1000):.016;last=ts;
  var cm=st.cam,sl=1;
  if(cm){cm.t+=dt;if(cm.t>=cm.dur||st.ovKind)st.cam=null;else sl=cm.t<cm.dur-.5?.3:.3+.7*((cm.t-(cm.dur-.5))/.5);}
  if(!st.paused)update(dt*sl);
  draw();
  requestAnimationFrame(frame);
}
